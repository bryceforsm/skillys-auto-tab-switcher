<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Skilly's Auto Tab Switcher Settings</title>
    <style>
        [hidden] {
            display: none !important;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Chrome caps popups at 800x600, so the layout is wide rather than tall. */
            width: 700px;
            padding: 15px;
            background-color: #ffffff;
            color: #202124;
            margin: 0;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            color: #202124;
        }
        .control-group {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .columns {
            display: grid;
            /* minmax(0, ...) stops long unbreakable text (URLs) from widening a column. */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .footer #saveAll {
            flex: 1;
        }
        label {
            font-size: 14px;
            color: #5f6368;
        }
        input[type="number"] {
            padding: 4px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            width: 60px;
            text-align: center;
            font-size: 14px;
        }
        select {
            padding: 4px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            width: 220px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #saveAll {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }
        #saveAll:hover {
            background-color: #e8eaed;
        }
        #saveAll.unsaved {
            background-color: #1a73e8;
            color: white;
            border: 1px solid #1a73e8;
        }
        #saveAll.unsaved:hover {
            background-color: #1557b0;
        }
        #toggleTimer {
            background-color: #1e8e3e;
            color: white;
            font-size: 13px;
            padding: 6px 12px;
            font-weight: bold;
            width: auto;
        }
        #toggleTimer:hover {
            background-color: #187031;
        }
        #toggleTimer.running {
            background-color: #d93025;
        }
        #toggleTimer.running:hover {
            background-color: #b31412;
        }
        .link-button {
            background-color: transparent;
            color: #1a73e8;
            text-decoration: underline;
            padding: 5px;
            font-size: 13px;
            width: auto;
            white-space: nowrap;
        }
        .link-button:hover {
            color: #1557b0;
        }
        #status {
            margin-top: 0;
            font-size: 12px;
            color: #188038;
            text-align: center;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .title-group {
            display: flex;
            align-items: center;
        }
        .title-group img {
            margin-right: 10px;
        }
        fieldset {
            border: 1px solid #dadce0;
            border-radius: 6px;
            padding: 8px;
            margin: 0 0 10px 0;
            /* Fieldsets default to min-content width, which nowrap text would stretch. */
            min-width: 0;
        }
        legend {
            font-size: 14px;
            color: #202124;
            font-weight: 500;
            padding: 0 5px;
        }
        .note {
            font-size: 11px;
            color: #5f6368;
            margin-bottom: 10px;
            text-align: center;
            font-style: italic;
        }
        #pageLabel {
            font-size: 12px;
            color: #1a73e8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }
        #effectiveRule {
            font-size: 11px;
            color: #5f6368;
            margin: -2px 0 2px 0;
            white-space: pre-line;
        }
        .rules-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            body {
                background-color: #202124;
                color: #e8eaed;
            }
            h2, legend {
                color: #e8eaed;
            }
            label, .note, #effectiveRule {
                color: #9aa0a6;
            }
            #pageLabel {
                color: #8ab4f8;
            }
            input[type="number"], select {
                background-color: #292a2d;
                color: #e8eaed;
                border: 1px solid #5f6368;
            }
            fieldset, .header-container {
                border-color: #5f6368;
            }
            #saveAll {
                background-color: #292a2d;
                color: #e8eaed;
                border: 1px solid #5f6368;
            }
            #saveAll:hover {
                background-color: #3c4043;
            }
            .link-button {
                color: #8ab4f8;
            }
            .link-button:hover {
                color: #aecbfa;
            }
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #theme {
            width: auto;
            font-size: 13px;
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>
    <div class="header-container">
        <div class="title-group">
            <img src="icons/icon128.png" alt="Logo" width="32" height="32">
            <h2>Skilly's Auto Tab Switcher</h2>
        </div>
        <div class="header-actions">
            <label for="theme" title="Color theme for the extension pages. System follows your OS setting.">Theme:</label>
            <select id="theme" title="Color theme for the extension pages. System follows your OS setting.">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <button id="toggleTimer">Start Timer</button>
        </div>
    </div>
    <div class="columns">
    <div>
    <div class="control-group" title="Set the time in seconds between tab switches.">
        <label for="interval">Interval (secs):</label>
        <input type="number" id="interval" min="5" value="30">
    </div>
    <div class="control-group" title="Choose how to pause the timer: Disable (never pause), On Activity (pause when mouse/keyboard used), or On Hover (pause when mouse is over the page).">
        <label for="pauseMode">Pause Timer:</label>
        <select id="pauseMode">
            <option value="disable">Disable</option>
            <option value="activity">On Activity</option>
            <option value="hover">On Hover</option>
        </select>
    </div>
    <div class="control-group" title="Automatically start the timer when the browser opens or a new window is created.">
        <label for="autoStart"><strong>Auto-Start Timer on Browser Launch:</strong></label>
        <input type="checkbox" id="autoStart">
    </div>
    <div class="control-group" title="Put the window in full screen when its timer starts, and restore it when the timer stops. Press F11 to leave full screen at any time.">
        <label for="fullscreenOnStart">Full Screen on Timer Start:</label>
        <input type="checkbox" id="fullscreenOnStart">
    </div>
    <fieldset>
        <legend>Default Refresh</legend>
        <div class="control-group" title="How pages without their own refresh rule are refreshed.">
            <label for="defaultMode">Refresh:</label>
            <select id="defaultMode"></select>
        </div>
        <div id="defaultMinutesWrap" class="control-group" title="Age limit or refresh period for the default mode, in minutes.">
            <label for="defaultMinutes">Minutes:</label>
            <input type="number" id="defaultMinutes" min="1" max="1440" value="5">
        </div>
    </fieldset>
    <fieldset>
        <legend>Default Auto Scroll</legend>
        <div class="control-group" title="Automatically scroll down the page while the timer is running.">
            <label for="autoScroll">Enable Auto Scroll:</label>
            <input type="checkbox" id="autoScroll">
        </div>
        <div class="control-group" title="Scroll back to the top of the page when switching to a new tab.">
            <label for="scrollToTop">Scroll to Top on Switch:</label>
            <input type="checkbox" id="scrollToTop">
        </div>
        <div class="control-group" title="Wait this many seconds before starting to scroll after switching.">
            <label for="scrollDelay">Scroll Delay (sec):</label>
            <input type="number" id="scrollDelay" min="0" value="5">
        </div>
        <div class="control-group" title="Adjust how fast the page scrolls.">
            <label for="scrollSpeed">Scroll Speed: <span id="scrollSpeedDisplay">20</span></label>
            <input type="range" id="scrollSpeed" min="1" max="100" value="20">
        </div>
    </fieldset>
    </div>
    <div>
    <fieldset>
        <legend>Current Tab</legend>
        <div id="pageRuleEditor">
            <div id="pageLabel"></div>
            <div class="control-group" title="A rule for this exact page (ignoring query string) takes priority over a rule for the whole site.">
                <label for="ruleScope">Apply to:</label>
                <select id="ruleScope">
                    <option value="site">This site</option>
                    <option value="page">This page only</option>
                </select>
            </div>
            <div class="control-group" title="How this site or page is refreshed.">
                <label for="ruleMode">Refresh:</label>
                <select id="ruleMode"></select>
            </div>
            <div id="ruleMinutesWrap" class="control-group" title="Age limit or refresh period for this rule, in minutes.">
                <label for="ruleMinutes">Minutes:</label>
                <input type="number" id="ruleMinutes" min="1" max="1440" value="5">
            </div>
            <div class="control-group" title="Whether this site or page auto scrolls.">
                <label for="ruleScrollMode">Auto Scroll:</label>
                <select id="ruleScrollMode">
                    <option value="default">Use default</option>
                    <option value="on">On</option>
                    <option value="off">Off</option>
                </select>
            </div>
            <div id="ruleScrollOptions">
                <div class="control-group" title="Scroll back to the top of this page when switching to it.">
                    <label for="ruleScrollToTop">Scroll to Top on Switch:</label>
                    <input type="checkbox" id="ruleScrollToTop">
                </div>
                <div class="control-group" title="Wait this many seconds before starting to scroll after switching.">
                    <label for="ruleScrollDelay">Scroll Delay (sec):</label>
                    <input type="number" id="ruleScrollDelay" min="0" value="5">
                </div>
                <div class="control-group" title="How fast this page scrolls.">
                    <label for="ruleScrollSpeed">Scroll Speed: <span id="ruleScrollSpeedDisplay">20</span></label>
                    <input type="range" id="ruleScrollSpeed" min="1" max="100" value="20">
                </div>
            </div>
            <div id="effectiveRule"></div>
        </div>
        <div id="pageRuleUnavailable" class="note" hidden>Page rules are not available for this tab.</div>
    </fieldset>
    <div class="rules-row">
        <span>Saved rules: <span id="ruleCount">0</span></span>
        <button id="manageRules" class="link-button" title="View, edit and remove all saved site and page rules in a full tab.">Manage rules</button>
    </div>
    </div>
    </div>
    <div class="note">
        Settings apply to all windows. Page rules apply wherever that page is open.
    </div>
    <div class="footer">
        <button id="saveAll">Save Settings</button>
        <label for="badgeColor" title="Change the color of the countdown badge on the extension icon.">Badge:</label>
        <input type="color" id="badgeColor" title="Change the color of the countdown badge on the extension icon.">
        <button id="toggleBadge" class="link-button">Hide Badge</button>
    </div>
    <div id="status"></div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
