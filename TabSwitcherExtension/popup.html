<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Skilly's Auto Tab Switcher Settings</title>
    <style>
        [hidden] {
            display: none !important;
        }
        /* Form controls default to Arial instead of the page font. */
        button, input, select {
            font-family: inherit;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Chrome caps popups at 800x600, so the layout is wide rather than tall. */
            width: 700px;
            padding: 15px;
            background-color: #ffffff;
            color: #202124;
            margin: 0;
        }
        /* The rule editor needs two columns, so only the collapsed popup can be narrower. */
        body:has(#ruleFields[hidden]) {
            width: 520px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            color: #202124;
        }
        .control-group {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .basics, .rule-columns {
            display: grid;
            /* minmax(0, ...) stops long unbreakable text (URLs) from widening a column. */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            column-gap: 16px;
            align-items: start;
        }
        .basics {
            margin-bottom: 4px;
        }
        /* Keep each input next to its label instead of pinned to the column edge. */
        .basics .control-group {
            justify-content: flex-start;
            gap: 10px;
        }
        .basics .control-group select {
            flex: none;
            min-width: 0;
            width: 115px;
        }
        /* Keep the label beside the dropdown and pin both to the right edge of the window. */
        .basics .control-group:last-child {
            justify-content: flex-end;
        }
        .summary-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }
        label {
            font-size: 14px;
            color: #5f6368;
        }
        input[type="number"] {
            padding: 4px;
            border: 1px solid #bdc1c6;
            border-radius: 4px;
            width: 60px;
            text-align: center;
            font-size: 14px;
        }
        /* The spinner arrows take space on the right and push the number off center. */
        input[type="number"] {
            appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button {
            appearance: none;
        }
        select {
            padding: 4px;
            border: 1px solid #bdc1c6;
            border-radius: 4px;
            font-size: 14px;
            width: 220px;
        }
        .inline-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 220px;
        }
        .inline-inputs select {
            flex: 1;
            min-width: 0;
            width: auto;
        }
        .inline-inputs span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .inline-inputs input[type="number"] {
            width: 50px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #toggleTimer {
            background-color: #1e8e3e;
            color: white;
            font-size: 13px;
            padding: 6px 12px;
            font-weight: bold;
            width: 104px;
            border: 2px solid #137333;
        }
        #toggleTimer:hover {
            background-color: #187031;
        }
        #toggleTimer.running {
            background-color: #d93025;
            border-color: #a50e0e;
        }
        #toggleTimer.running:hover {
            background-color: #b31412;
        }
        :root[data-theme="dark"] #toggleTimer, :root[data-theme="dark"] #toggleTimer.running {
            border-color: rgba(255, 255, 255, 0.45);
        }
        :root[data-theme="dark"] .title-group img {
            filter: grayscale(1);
        }
        .link-button {
            background-color: transparent;
            color: #1a73e8;
            text-decoration: underline;
            padding: 5px;
            font-size: 13px;
            width: auto;
            white-space: nowrap;
        }
        .link-button:hover {
            color: #1557b0;
        }
        #status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            color: #188038;
            margin-top: 4px;
        }
        #status:has(#statusText:empty) {
            display: none;
        }
        #status .link-button {
            padding: 0 5px;
            font-size: 12px;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .title-group {
            display: flex;
            align-items: center;
        }
        .timer-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #shortcutHint {
            font-size: 11px;
            color: #3c4043;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .title-group img {
            margin-right: 10px;
        }
        fieldset {
            border: 1px solid #dadce0;
            border-radius: 6px;
            padding: 8px;
            margin: 0 0 10px 0;
            /* Fieldsets default to min-content width, which nowrap text would stretch. */
            min-width: 0;
        }
        legend {
            font-size: 14px;
            color: #202124;
            font-weight: 500;
            padding: 0 5px;
        }
        .note {
            font-size: 11px;
            color: #3c4043;
            margin-bottom: 10px;
            text-align: center;
            font-style: italic;
        }
        .page-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        #pageLabel {
            font-size: 12px;
            color: #1a73e8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .rule-chips {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .rule-chip {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            padding: 1px 8px;
            border: 1px solid #dadce0;
            border-radius: 10px;
            color: #5f6368;
            white-space: nowrap;
        }
        .rule-chip.active {
            background-color: #e8f0fe;
            border-color: #1a73e8;
            color: #1967d2;
            font-weight: 600;
        }
        .rule-chip .link-button {
            margin-left: 6px;
            padding: 0 0 0 6px;
            border-left: 1px solid currentColor;
            border-radius: 0;
            font-size: 12px;
            font-weight: 600;
            color: inherit;
            text-decoration: none;
        }
        .rule-chip .link-button:hover {
            color: inherit;
            text-decoration: underline;
        }
        #effectiveRule {
            font-size: 11px;
            color: #3c4043;
            white-space: pre-line;
        }
        .rules-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            /* Mirrors the header line so the popup has a clear bottom edge. */
            border-top: 1px solid #e0e0e0;
            padding-top: 4px;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            body {
                background-color: #202124;
                color: #e8eaed;
            }
            h2, legend {
                color: #e8eaed;
            }
            label, .note, #effectiveRule, #shortcutHint {
                color: #9aa0a6;
            }
            #pageLabel {
                color: #8ab4f8;
            }
            input[type="number"], select {
                background-color: #292a2d;
                color: #e8eaed;
                border: 1px solid #5f6368;
            }
            fieldset, .header-container, .rules-row {
                border-color: #5f6368;
            }
            .rule-chip {
                border-color: #5f6368;
                color: #9aa0a6;
            }
            .rule-chip.active {
                background-color: #263753;
                border-color: #8ab4f8;
                color: #8ab4f8;
            }
            #status {
                color: #81c995;
            }
            .link-button {
                color: #8ab4f8;
            }
            .link-button:hover {
                color: #aecbfa;
            }
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>
    <div class="header-container">
        <div class="title-group">
            <img src="icons/icon128.png" alt="Logo" width="32" height="32">
            <h2>Skilly's Auto Tab Switcher</h2>
        </div>
        <div class="timer-group">
            <span id="shortcutHint" hidden></span>
            <button id="toggleTimer">Start Timer</button>
        </div>
    </div>
    <div class="basics">
    <div class="control-group" title="How many seconds each tab stays on screen before switching to the next one.">
        <label for="interval">Show Each Tab For (sec):</label>
        <input type="number" id="interval" min="5" max="86400" value="30">
    </div>
    <div class="control-group" title="Choose how to pause the timer: Disable (never pause), On activity (pause when mouse/keyboard used), or On hover (pause when mouse is over the page or this popup is open).">
        <label for="pauseMode">Pause Timer:</label>
        <select id="pauseMode">
            <option value="disable">Disable</option>
            <option value="activity">On activity</option>
            <option value="hover">On hover</option>
        </select>
    </div>
    </div>
    <fieldset>
        <legend>Current Tab</legend>
        <div id="pageRuleEditor">
            <div class="page-row">
                <div id="pageLabel"></div>
                <div class="rule-chips">
                    <span id="pageChip" class="rule-chip" title="Whether this exact page has its own rule. It beats the site rule.">
                        <span id="pageChipText">No page rule</span>
                        <button id="pageReset" class="link-button" title="Remove this page's rule so it uses the site rule or the defaults." hidden>Reset</button>
                    </span>
                    <span id="siteChip" class="rule-chip" title="Whether this whole site has its own rule.">
                        <span id="siteChipText">No site rule</span>
                        <button id="siteReset" class="link-button" title="Remove the whole-site rule so this site uses the defaults." hidden>Reset</button>
                    </span>
                </div>
            </div>
            <div id="ruleFields" class="rule-columns">
            <div>
            <div class="control-group" title="A rule for this exact page (ignoring query string) takes priority over a rule for the whole site.">
                <label for="ruleScope">Apply To:</label>
                <select id="ruleScope">
                    <option value="site">Whole site</option>
                    <option value="page">This page only</option>
                </select>
            </div>
            <div class="control-group" title="How long this site or page stays on screen before switching to the next tab.">
                <label for="ruleDisplayMode">Show For:</label>
                <div class="inline-inputs">
                    <select id="ruleDisplayMode">
                        <option value="default">Use default</option>
                        <option value="custom">Custom</option>
                    </select>
                    <span id="ruleDisplayWrap">
                        <input type="number" id="ruleDisplaySeconds" min="5" max="86400" value="30">
                        <label for="ruleDisplaySeconds">sec</label>
                    </span>
                </div>
            </div>
            <div class="control-group" title="How this site or page is refreshed.">
                <label for="ruleMode">Refresh:</label>
                <select id="ruleMode"></select>
            </div>
            <div id="ruleMinutesWrap" class="control-group" title="Age limit or refresh period for this rule, in minutes.">
                <label for="ruleMinutes" id="ruleMinutesLabel">If Older Than (min):</label>
                <input type="number" id="ruleMinutes" min="1" max="1440" value="5">
            </div>
            </div>
            <div>
            <div class="control-group" title="Whether this site or page auto scrolls.">
                <label for="ruleScrollMode">Auto Scroll:</label>
                <select id="ruleScrollMode">
                    <option value="default">Use default</option>
                    <option value="off">Disable</option>
                    <option value="on">Enable</option>
                </select>
            </div>
            <div id="ruleScrollOptions">
                <div class="control-group" title="Scroll back to the top of this page when switching to it.">
                    <label for="ruleScrollToTop">Scroll to Top on Switch:</label>
                    <input type="checkbox" id="ruleScrollToTop">
                </div>
                <div class="control-group" title="Wait this many seconds before starting to scroll after switching.">
                    <label for="ruleScrollDelay">Scroll Delay (sec):</label>
                    <input type="number" id="ruleScrollDelay" min="0" max="3600" value="5">
                </div>
                <div class="control-group" title="How fast this page scrolls.">
                    <label for="ruleScrollSpeed">Scroll Speed: <span id="ruleScrollSpeedDisplay">20</span></label>
                    <input type="range" id="ruleScrollSpeed" min="1" max="100" value="20">
                </div>
            </div>
            </div>
            </div>
            <div class="summary-row">
                <div id="effectiveRule"></div>
                <button id="customize" class="link-button" title="Give this site or page its own Show For, Refresh or Auto Scroll.">Customize</button>
            </div>
        </div>
        <div id="pageRuleUnavailable" class="note" hidden>Page rules are not available for this tab.</div>
    </fieldset>
    <div class="rules-row">
        <span>Saved Rules: <span id="ruleCount">0</span></span>
        <button id="manageRules" class="link-button" title="Defaults, auto start, full screen, theme, badge and every saved rule, in a full tab.">More Settings and Rules</button>
    </div>
    <div id="status"><span id="statusText"></span><button id="undo" class="link-button" hidden>Undo</button></div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
